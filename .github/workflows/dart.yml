name: Flutter Build Artifacts

on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "test"]
  pull_request:
    branches: ["main", "master", "test"]

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Print Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate Android local.properties for CI
        shell: bash
        run: |
          printf '%s\n' \
            "sdk.dir=${ANDROID_SDK_ROOT}" \
            "flutter.sdk=${FLUTTER_ROOT}" \
            "flutter.buildMode=release" \
            "flutter.versionName=1.0.0" \
            "flutter.versionCode=1" \
            > android/local.properties

      - name: Prepare fvp Flutter SDK path for CI
        shell: bash
        run: |
          if [ ! -f "${FLUTTER_ROOT}/version" ]; then
            FLUTTER_SEMVER="$(flutter --version | head -n 1 | sed -E 's/.*Flutter ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
            echo "${FLUTTER_SEMVER}" > "${FLUTTER_ROOT}/version"
          fi

          for FVP_ANDROID_DIR in "${PUB_CACHE}"/hosted/pub.dev/fvp-*/android; do
            if [ -d "${FVP_ANDROID_DIR}" ]; then
              printf '%s\n' "flutter.sdk=${FLUTTER_ROOT}" > "${FVP_ANDROID_DIR}/local.properties"
            fi
          done

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Print Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Archive Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\windows-release.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/windows-release.zip
          if-no-files-found: error

  build-ios-no-sign:
    name: Build iOS (No Codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Print Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Archive iOS app bundle
        run: |
          mkdir -p dist
          cd build/ios/iphoneos
          zip -r ../../../dist/ios-runner-app-no-sign.zip Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-no-sign
          path: dist/ios-runner-app-no-sign.zip
          if-no-files-found: error
